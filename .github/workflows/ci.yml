name: CI

# Validation only - never pushes an image. Releases are handled by
# docker-publish.yml, which runs on v* tags.
on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

# A rapid series of pushes to master (each file committed through the GitHub API is
# its own push) used to start a full CI run per commit, all but the last already
# obsolete. Only the newest run per branch matters, so supersede the rest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Hard failure: a syntax error here breaks every container on start.
      # entrypoint.sh targets busybox ash, so check with dash (POSIX sh) too.
      - name: Shell syntax (POSIX)
        run: |
          for f in entrypoint.sh healthcheck.sh; do
            [ -f "$f" ] || continue
            sh -n "$f"    && echo "sh -n   OK: $f"
            dash -n "$f"  && echo "dash -n OK: $f"
          done

      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      # Hard gate. Both scripts are clean at severity=error, so any new one is a
      # real regression rather than pre-existing noise. Kept separate from the
      # informational run below so the gate cannot be drowned out by style hits.
      - name: ShellCheck (errors only - gate)
        run: |
          for f in entrypoint.sh healthcheck.sh; do
            [ -f "$f" ] || continue
            shellcheck -s sh -S error -f gcc "$f" && echo "no errors: $f"
          done

      # Informational: ~200 mostly-stylistic findings remain (printf format
      # strings, intentional word splitting). Surfaced for visibility only.
      - name: ShellCheck (all severities - informational)
        continue-on-error: true
        run: |
          shellcheck -s sh -f gcc entrypoint.sh | head -40 || true
          echo "total findings: $(shellcheck -s sh -f gcc entrypoint.sh | wc -l)"

      # POSIX sh creates a function when its definition is EXECUTED, not when the
      # file is parsed, so a call above the definition is a silent 127. That
      # shipped once (v5.2.3-16: pf_bind called at 1191, defined at 1374) and left
      # port forwarding dead for the life of the container. Neither sh -n nor
      # shellcheck flags it, so it needs its own gate.
      - name: Functions defined before first use
        run: |
          chmod +x scripts/check-function-order.sh
          ./scripts/check-function-order.sh entrypoint.sh healthcheck.sh

      - name: Validate Unraid templates (XML must parse)
        run: |
          for f in pia-qbittorrent.xml ca_profile.xml; do
            [ -f "$f" ] || continue
            python3 -c "import xml.etree.ElementTree as ET,sys; ET.parse(sys.argv[1]); print('XML OK: '+sys.argv[1])" "$f"
          done

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config >/dev/null && echo "compose OK"

      # The env vars the script reads should be documented for users. This is a
      # reminder, not a gate - internal shell locals also match the pattern.
      # -w matters: without it PORT matches PORT_FORWARDING and almost nothing
      # is ever reported, which made the earlier version of this check a no-op.
      - name: Env vars referenced vs documented
        continue-on-error: true
        run: |
          missing=0
          for v in $(grep -oE '\$\{?[A-Z][A-Z0-9_]{2,}\}?' entrypoint.sh | tr -d '${}' | sort -u); do
            grep -qw "$v" README.md || { echo "not in README: $v"; missing=$((missing + 1)); }
          done
          echo "undocumented candidates: $missing (expected: internal locals only)"

  build:
    name: Build image (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # Catches a broken Dockerfile or a dead upstream tarball URL before it is
      # tagged - which has bitten before (a libtorrent release was tagged a day
      # before its source tarball was published, so the URL 404'd).
      - name: Build amd64 only
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          # A cold build compiles Boost, libtorrent and qBittorrent from source
          # (~25 min). Caching the layers keeps a docs-only PR to a couple of
          # minutes; the cache is scoped to this workflow so it never collides
          # with the release build.
          cache-from: type=gha,scope=ci-amd64
          cache-to: type=gha,mode=max,scope=ci-amd64
