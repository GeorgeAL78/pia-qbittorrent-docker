name: CI

# Validation only - never pushes an image. Releases are handled by
# docker-publish.yml, which runs on v* tags.
on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

# A rapid series of pushes to master (each file committed through the GitHub API is
# its own push) used to start a full CI run per commit, all but the last already
# obsolete. Only the newest run per branch matters, so supersede the rest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  build:
    name: Build image (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # Catches a broken Dockerfile or a dead upstream tarball URL before it is
      # tagged - which has bitten before (a libtorrent release was tagged a day
      # before its source tarball was published, so the URL 404'd).
      - name: Build amd64 only
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          # A cold build compiles Boost, libtorrent and qBittorrent from source
          # (~25 min). Caching the layers keeps a docs-only PR to a couple of
          # minutes; the cache is scoped to this workflow so it never collides
          # with the release build.
          cache-from: type=gha,scope=ci-amd64
          cache-to: type=gha,mode=max,scope=ci-amd64
