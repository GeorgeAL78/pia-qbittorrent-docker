name: Auto release

# Every 6 hours:
#   beta   - qBittorrent published anything newer than the beta branch's pin
#            (pre-releases included): bump beta, tag it, publish :beta.
#   stable - :latest is out of date: a newer stable qBittorrent, libtorrent 2.1.x,
#            Boost or Ninja, a newer Alpine point release, or newer Alpine packages
#            than the published image has. Bumps master's pins if needed, tags
#            vX.Y.Z (new qBittorrent) or vX.Y.Z-N (rebuild) and publishes :latest.
# The publish workflow lints, builds and smoke-tests before anything is pushed.

on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print what would happen'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Beta - newest qBittorrent release
        run: python3 scripts/auto-release.py beta
      - name: Stable - release :latest when anything in it is out of date
        run: python3 scripts/auto-release.py stable
